name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name iPhoneCalculator app.py
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone-Calculator-Windows
          path: dist/iPhoneCalculator.exe
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: iPhone Calculator v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: dist/iPhoneCalculator.exe
